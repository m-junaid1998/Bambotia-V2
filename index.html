<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <title>BAMBOTIA — Luxury Jewellery, Cosmetics &amp; Accessories</title>
    <meta
      name="description"
      content="Discover curated luxury jewellery, professional cosmetics &amp; designer purses at BAMBOTIA. Global luxury meets Pakistani elegance."
    />
    <meta name="author" content="Muhammad Junaid Bambotia" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@bambotia" />
    <meta
      property="og:title"
      content="BAMBOTIA — Luxury Jewellery, Cosmetics &amp; Accessories"
    />
    <meta
      name="twitter:title"
      content="BAMBOTIA — Luxury Jewellery, Cosmetics &amp; Accessories"
    />
    <meta
      property="og:description"
      content="Discover curated luxury jewellery, professional cosmetics &amp; designer purses at BAMBOTIA. Global luxury meets Pakistani elegance."
    />
    <meta
      name="twitter:description"
      content="Discover curated luxury jewellery, professional cosmetics &amp; designer purses at BAMBOTIA. Global luxury meets Pakistani elegance."
    />

    <!-- Preconnect to font origins so DNS/TLS resolve early without blocking render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Load Google Fonts CSS without blocking rendering (swap media once loaded) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600&display=swap"
      />
    </noscript>

    <!-- Google Identity Services is only needed on the sign in / sign up pages, so it is
         injected dynamically from those pages instead of being loaded on every route. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
